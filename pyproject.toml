[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qos_offloading"
version = "2.0.0"
description = "QoS-Aware Deep Reinforcement Learning for SLA-Differentiated Task Offloading in the IoT Edge-Cloud Continuum"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["qos_offloading*"]
