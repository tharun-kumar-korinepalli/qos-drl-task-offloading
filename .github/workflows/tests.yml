name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy gymnasium stable-baselines3 sb3-contrib scipy matplotlib pytest
      - run: pip install -e .
      - run: pytest -q
      - run: python experiments/01_sanity_check.py
